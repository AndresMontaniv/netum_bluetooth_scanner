name: netum_bluetooth_scanner
description: "Flutter plugin for NETUM Bluetooth barcode scanners (BLE on Android & iOS, SPP on Android): scan streams, multi-device, commands."
version: 0.1.1
homepage: https://github.com/AndresMontaniv/netum_bluetooth_scanner
repository: https://github.com/AndresMontaniv/netum_bluetooth_scanner
issue_tracker: https://github.com/AndresMontaniv/netum_bluetooth_scanner/issues
screenshots:
  - description: "Example app, Scanners tab: connected, saved and paired scanners with BLE and SPP badges; a saved scanner marked in range."
    path: doc/screenshots/scanners.webp
  - description: "Example app, Scans tab: every barcode with the scanner that read it, the time and the raw bytes."
    path: doc/screenshots/scans.webp
  - description: "Example app, Console tab: typed settings, queries and actions with their results in the log."
    path: doc/screenshots/console.webp
topics:
  - barcode
  - scanner
  - bluetooth
  - ble
  - spp

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  # Imported by the Pigeon-generated Dart code; pinned by the Flutter SDK.
  meta: ^1.12.0

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  pigeon: ^29.0.8
  very_good_analysis: ^10.2.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.andresmontano.netum_bluetooth_scanner.plugin
        pluginClass: NetumBluetoothScannerPlugin
      ios:
        pluginClass: NetumBluetoothScannerPlugin
